name: Build Android (EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
          - production-apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - run: npx tsc --noEmit

      - name: EAS build
        run: |
          eas build --platform android --profile ${{ inputs.profile }} --non-interactive --wait --json > build.json
          url=$(jq -r '.[0].artifacts.buildUrl' build.json)
          echo "Build: $url"
          mkdir -p out
          curl -sSL -o "out/ip-aldeia-${{ inputs.profile }}.${url##*.}" "$url"

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.profile }}
          path: out/
